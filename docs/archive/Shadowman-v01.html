<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadowman — Terminal 08</title><style>*{box-sizing:border-box}body{margin:0;background:#080d17;color:#d7dfeb;font:14px system-ui}main{max-width:1100px;margin:24px auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center}h1{letter-spacing:5px;font-family:Georgia}h1 span{color:#43baff}small{color:#92a5bd}canvas{width:100%;background:#101b2e;border:1px solid #45617a;display:block;touch-action:none}button{background:#18364e;border:1px solid #4693b8;color:white;padding:15px;cursor:pointer}nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px}nav button{touch-action:none;user-select:none}p{line-height:1.7;color:#9eb0c7}</style><main><header><div><small>SENNA COMICS · PROTÓTIPO RECONSTRUÍDO</small><h1>SHADOW<span>MAN</span></h1></div><button id="start">INICIAR JORNADA</button></header><canvas id="c" width="1100" height="550" aria-label="Shadowman: plataforma e combate de sombras"></canvas><nav><button data-k="ArrowLeft">←</button><button data-k="ArrowRight">→</button><button data-k="Space">PULAR</button><button data-k="KeyJ">SOMBRAS · J</button><button data-k="KeyK">DESLOCAR · K</button><button id="pause">PAUSAR · P</button></nav><p>Setas ou A/D: mover · Espaço: pular · J: ataque de sombras · K: deslocamento sombrio · P: pausa.<br>Encontre três fragmentos azuis nos telhados para abrir o Terminal 08. Derrote o vigia. As plataformas com borda azul são o caminho jogável.</p></main><script>
'use strict';const c=document.querySelector('#c'),g=c.getContext('2d'),keys=new Set(),W=1100,H=550,L=3400;
let player,foes,items,boss,fx,cam=0,time=0,active=false,paused=false,notice='Clique em INICIAR JORNADA',last=0,acc=0,spawn=70;
const floors=[{x:0,y:465,w:760,h:90},{x:840,y:465,w:700,h:90},{x:1640,y:465,w:1760,h:90},{x:300,y:365,w:160,h:22},{x:580,y:285,w:170,h:22},{x:1040,y:365,w:190,h:22},{x:1330,y:295,w:170,h:22},{x:1790,y:365,w:170,h:22},{x:2100,y:290,w:180,h:22},{x:2420,y:375,w:160,h:22}];
function reset(){player={x:70,y:380,w:26,h:48,vy:0,face:1,hp:6,ground:false,inv:0,attack:0,cool:0,dash:0,dc:0};foes=[450,990,1430,1860,2360].map(x=>({x,y:421,w:28,h:44,hp:3,home:x}));boss={x:3030,y:387,w:54,h:78,hp:15,clock:0};items=[{x:650,y:250},{x:1410,y:260},{x:2180,y:255}];fx=[];spawn=70;cam=0;paused=false;notice='Encontre os três fragmentos de sombra.';}reset();
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;const count=()=>items.filter(s=>s.taken).length;
function burst(x,y){for(let i=0;i<18;i++)fx.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.6)*6,life:30});}
function end(win){active=false;notice=win?'TERMINAL 08 LIBERTADO — você dominou as sombras.':'As sombras o alcançaram. Tente novamente.';document.querySelector('#start').textContent='JOGAR NOVAMENTE';}
function damage(){if(player.inv||player.dash||!active)return;player.hp--;player.inv=70;player.vy=-5;burst(player.x,player.y+20);if(player.hp<=0)end(false);}
function action(k){if(k==='KeyP'){if(active)paused=!paused;return;}if(!active||paused)return;const p=player;if(k==='Space'&&p.ground){p.vy=-12.8;p.ground=false;}if(k==='KeyK'&&!p.dc){p.dash=15;p.dc=65;}if(k==='KeyJ'&&!p.cool){p.attack=18;p.cool=28;const area={x:p.face===1?p.x+p.w:p.x-130,y:p.y-8,w:130,h:70};for(const e of [...foes,boss])if(e.hp>0&&(e!==boss||count()===3)&&hit(area,e)){e.hp--;burst(e.x,e.y+20);if(e!==boss)e.x+=p.face*12;if(e===boss&&e.hp===0)end(true);}}}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','KeyA','KeyD','Space','KeyJ','KeyK','KeyP'].includes(e.code)){e.preventDefault();keys.add(e.code);if(!e.repeat)action(e.code);}});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{keys.clear();if(active)paused=true;});
document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.k);action(b.dataset.k);};for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(b.dataset.k));});document.querySelector('#pause').onclick=()=>action('KeyP');document.querySelector('#start').onclick=()=>{reset();keys.clear();active=true;document.querySelector('#start').textContent='RECOMEÇAR';};
function update(){if(!active||paused)return;time++;const p=player;for(const k of ['inv','attack','cool','dash','dc'])p[k]=Math.max(0,p[k]-1);const move=+(keys.has('ArrowRight')||keys.has('KeyD'))- +(keys.has('ArrowLeft')||keys.has('KeyA'));if(move)p.face=move;p.x=Math.max(0,Math.min(L-p.w,p.x+(p.dash?p.face*10:move*3.7)));const feet=p.y+p.h;p.vy=Math.min(13,p.vy+.59);p.y+=p.vy;p.ground=false;for(const f of floors)if(p.x+p.w>f.x&&p.x<f.x+f.w&&feet<=f.y&&p.y+p.h>=f.y&&p.vy>=0){p.y=f.y-p.h;p.vy=0;p.ground=true;}if(p.y>650){damage();p.x=spawn;p.y=330;p.vy=0;}for(const s of items)if(!s.taken&&Math.hypot(p.x+13-s.x,p.y+24-s.y)<43){s.taken=true;spawn=p.x;burst(s.x,s.y);notice=count()===3?'O Terminal 08 abriu. Enfrente o vigia.':'Fragmento recuperado.';}
for(const e of foes)if(e.hp>0){let nx=e.x+Math.sign(Math.abs(p.x-e.x)<250?p.x-e.x:Math.sin(time/90+e.home))*.8;if(floors.some(f=>f.y===465&&nx>=f.x&&nx+e.w<=f.x+f.w))e.x=nx;if(hit(p,e))damage();}
if(count()<3&&p.x>2695){p.x=2695;notice='O portão exige os três fragmentos.';}if(count()===3&&p.x>2670&&boss.hp>0){boss.clock=(boss.clock+1)%140;boss.x=Math.max(2780,Math.min(3300,boss.x+Math.sign(p.x-boss.x)*(boss.clock>105?4:.5)));if(hit(p,{x:boss.x-(boss.clock>105?20:0),y:boss.y,w:boss.w+(boss.clock>105?40:0),h:boss.h}))damage();}for(const a of fx){a.x+=a.vx;a.y+=a.vy;a.life--;}fx=fx.filter(a=>a.life>0);cam=Math.max(0,Math.min(L-W,p.x-380));}
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),w,h);}function text(s,x,y,size=14,col='#bfd3e6'){g.font=size+'px system-ui';g.fillStyle=col;g.fillText(s,x,y);}
function figure(x,y,scale=1,evil=false,face=1){g.save();g.translate(x+13*scale,y);g.scale(scale*face,scale);const step=active&&!paused?Math.sin(time*.18)*3:0;g.fillStyle=evil?'#343044':'#080f1c';g.beginPath();g.moveTo(-6,8);g.lineTo(-29,47);g.lineTo(9,40);g.lineTo(14,15);g.fill();rect(-8,32,7,16+step,'#1b293a');rect(4,32,7,16-step,'#253447');rect(-10,14,24,23,evil?'#474054':'#172333');rect(-10,2,24,18,'#050c16');g.beginPath();g.moveTo(-13,8);g.lineTo(0,-5);g.lineTo(15,8);g.fill();rect(3,8,8,3,evil?'#f47b83':'#42bcff');if(!evil){g.strokeStyle='#44bfff';g.lineWidth=1.7;g.beginPath();g.ellipse(-1,25,4,2.5,-.4,0,Math.PI*2);g.ellipse(6,25,4,2.5,.4,0,Math.PI*2);g.stroke();}rect(12,22,5,14,'#26364a');g.restore();}
function draw(){const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#07101e');sky.addColorStop(1,'#23405a');g.fillStyle=sky;g.fillRect(0,0,W,H);g.fillStyle='#8ca8bd';g.beginPath();g.arc(800-cam*.04,65,32,0,Math.PI*2);g.fill();for(let i=0;i<28;i++){const x=i*70-cam*.13,y=100+(i*71)%180;rect(x,y,52,360-y,'#101e30');g.fillStyle='#101e30';g.beginPath();g.moveTo(x-4,y);g.lineTo(x+26,y-38-(i%4)*15);g.lineTo(x+56,y);g.fill();for(let j=0;j<7;j++)for(let k=0;k<3;k++)if((i+j+k)%3)rect(x+8+k*14,y+16+j*22,3,7,'#c28e4b');}rect(0,340,W,210,'#142d40');for(let i=0;i<75;i++)rect((i*83-cam*.18+W)%W,350+(i*37)%190,8+i%25,2,'#b58b4544');rect(0,270,W,8,'#162031');for(let i=0;i<9;i++){const x=i*160-cam*.23;rect(x,237,8,130,'#101c2b');g.strokeStyle='#182537';g.lineWidth=3;g.beginPath();g.moveTo(x-160,244);g.quadraticCurveTo(x-80,300,x,244);g.stroke();}
g.save();g.translate(-cam,0);for(const f of floors){if(f.x>cam+W||f.x+f.w<cam)continue;rect(f.x,f.y,f.w,f.h,'#172434');rect(f.x,f.y,f.w,4,'#63aabd');rect(f.x,f.y+4,f.w,8,'#31455b');for(let x=f.x+5;x<f.x+f.w-30;x+=43)rect(x,f.y+16,36,14,'#263649');if(f.h<40){rect(f.x+12,f.y+f.h,6,42,'#1d3040');rect(f.x+f.w-20,f.y+f.h,6,42,'#1d3040');}else for(let x=f.x+30;x<f.x+f.w-30;x+=95){rect(x,f.y+33,14,23,'#a7783d');rect(x+5,f.y+33,3,23,'#24313e');}}
for(const s of items)if(!s.taken){g.save();g.translate(s.x,s.y+Math.sin(time*.07)*4);g.rotate(Math.PI/4);g.shadowColor='#23aaff';g.shadowBlur=18;g.strokeStyle='#78d4ff';g.lineWidth=3;g.strokeRect(-9,-9,18,18);g.restore();}if(count()<3)for(let i=0;i<6;i++)rect(2740+i*14,250,4,215,'#4992b0');rect(3070,275,150,190,'#080f18');text('TERMINAL 08',3080,266,16,'#c6ac7b');
for(const e of foes)if(e.hp>0)figure(e.x,e.y,1,true,Math.sign(player.x-e.x)||1);if(boss.hp>0){figure(boss.x,boss.y,1.65,true,-1);if(boss.clock>80){g.strokeStyle='#f96e8588';g.lineWidth=3;g.beginPath();g.arc(boss.x+25,boss.y+40,80,0,Math.PI*2);g.stroke();}}
const p=player;if(!(p.inv&&time%8<4))figure(p.x,p.y,1,false,p.face);if(p.attack||p.dash){g.save();g.translate(p.x+13,p.y+24);g.scale(p.face,1);for(let i=0;i<5;i++){g.strokeStyle=i%2?'#29a6ff':'#081427';g.lineWidth=7-i;g.beginPath();g.moveTo(5,4);g.bezierCurveTo(50,-20+i*10,85,25-i*11,p.attack?140:-75,-10+i*8);g.stroke();}g.restore();}for(const a of fx)rect(a.x,a.y,3,3,'#46bfff');g.restore();rect(20,18,225,62,'#07101ed9');text('SHADOWMAN',33,39,12);for(let i=0;i<6;i++)rect(33+i*33,51,27,8,i<p.hp?'#3aaff0':'#293648');text('FRAGMENTOS '+count()+' / 3',W-180,40);rect(0,H-38,W,38,'#080f1bda');text(notice,22,H-14,13);if(p.x>2670&&count()===3&&boss.hp>0){text('VIGIA DO TERMINAL',740,67,12);rect(740,76,310,6,'#352e45');rect(740,76,310*boss.hp/15,6,'#ba6c85');}if(!active||paused){rect(190,150,720,150,'#07101edf');text(paused?'PAUSADO':player.hp<=0?'ERGA-SE, SHADOWMAN':boss.hp<=0?'AS SOMBRAS OBEDECEM':'AS SOMBRAS DESPERTAM',235,205,29,'#73caff');text(paused?'Pressione P para continuar':'Use o botão no alto para iniciar ou recomeçar.',235,253,16);}}
function frame(now){acc+=Math.min(50,now-last);last=now;while(acc>=1000/60){update();acc-=1000/60;}draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
