<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#07101a;color:#fff;font:14px monospace}canvas{display:block}#info{padding:10px}</style><canvas width="1200" height="600"></canvas><div id="info"></div><script src="../level.js"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),image=new Image(),index=+(new URLSearchParams(location.search).get('scene')||0),scene=SHADOWMAN_LEVEL.scenes[index],crop=scene.crop;let geometry=new URLSearchParams(location.search).has('geometry');image.src='../assets/storyboard-clean.png';
function draw(){ctx.drawImage(image,crop.x,crop.y,crop.w,crop.h,0,0,1200,600);ctx.font='12px monospace';for(let x=-50;x<750;x+=50){const dx=(index%3*724+x-crop.x)/crop.w*1200;ctx.strokeStyle='#34e6ff55';ctx.beginPath();ctx.moveTo(dx,0);ctx.lineTo(dx,600);ctx.stroke();ctx.fillStyle='#00ffff';ctx.fillText(x,dx+3,18);}for(let y=0;y<375;y+=25){const dy=(Math.floor(index/3)*362+y-crop.y)/crop.h*600;ctx.strokeStyle='#34e6ff55';ctx.beginPath();ctx.moveTo(0,dy);ctx.lineTo(1200,dy);ctx.stroke();ctx.fillStyle='#00ffff';ctx.fillText(y,4,dy+13);}if(geometry){ctx.strokeStyle='#ff456bcc';ctx.lineWidth=2;for(const f of SHADOWMAN_LEVEL.terrain)if(f.scene===index){ctx.beginPath();ctx.moveTo(f.x-scene.start,f.y-scene.offsetY);ctx.lineTo(f.x+f.w-scene.start,f.y-scene.offsetY);ctx.stroke();}}document.querySelector('#info').textContent=`Sala${index+1}. Coordenadas compatíveis com level.point. Tecla G liga/desliga colisões.`;}
image.onload=draw;document.onkeydown=e=>{if(e.key.toLowerCase()==='g'){geometry=!geometry;draw();}};canvas.onclick=e=>{const r=canvas.getBoundingClientRect();document.querySelector('#info').textContent=JSON.stringify({scene:index+1,x:Math.round(crop.x+(e.clientX-r.left)/r.width*crop.w-index%3*724),y:Math.round(crop.y+(e.clientY-r.top)/r.height*crop.h-Math.floor(index/3)*362)});};
</script>
